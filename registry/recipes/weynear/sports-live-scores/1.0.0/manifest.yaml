api_version: automations.weynear.com/v1
kind: Automation
metadata:
  name: live-sports-scores
  display_name: ${DISPLAY_NAME}
spec:
  runtime:
    language: python
    version: "3.12"
    entrypoint: main:handler
  bot:
    bot_id: ${BOT_ID}
  configuration:
    SPORTS_API_URL: https://api.sports-provider.example/v1/live
  destinations:
    - id: epl-public-posts
      type: posts
      visibility: ${BINDING:score-posts:SCOPE}
      reply_policy: everyone
  triggers:
    - id: live-score-poll
      type: schedule
      cron: "* * * * *"
      timezone: UTC
      concurrency_policy: FORBID
      retry:
        maximum_attempts: 3
        initial_backoff_seconds: 5
        maximum_backoff_seconds: 60
  connections:
    - id: sports-data
      type: https_api
      hosts:
        - api.sports-provider.example
      methods:
        - GET
      authentication:
        type: bearer_secret
        secret_name: SPORTS_API_TOKEN
  permissions:
    - config:read
    - state:read
    - state:write
    - http:fetch:connection:sports-data
    - posts:upsert:destination:epl-public-posts
    - logs:write
  limits:
    timeout_seconds: 20
    memory_mb: 256
    temporary_disk_mb: 64
    maximum_state_writes: 50
    maximum_post_actions: 20
    maximum_log_bytes: 65536
