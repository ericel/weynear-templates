api_version: registry.automations.weynear.com/v1
kind: AutomationTemplate
metadata:
  publisher: weynear
  name: sports-live-scores
  version: 1.4.0
  display_name: Live Sports Scores
  summary: Publish league score cards and significant-event alerts to one consented topic audience.
  status: approved
  license: Apache-2.0
  categories:
  - sports
  tags:
  - live-scores
  - football
  - leagues
  - alerts
spec:
  source:
    repository: https://github.com/ericel/wahalao-automation
    commit: ab52a0ac8ddff201f8e6685a38cf726e833ab55f
    path: trusted_builtins/sports_live_scores
  artifact:
    uri: us-central1-docker.pkg.dev/wahalao/wahalao-automations/weynear/sports-live-scores@sha256:2755312f4f070fe80aa793341c051e65998699fa30840da9a8e4722f278414ed
    digest: sha256:2755312f4f070fe80aa793341c051e65998699fa30840da9a8e4722f278414ed
    media_type: application/vnd.oci.image.manifest.v1+json
    platform:
      os: linux
      architecture: amd64
  runtime_adapter: sports-live-scores-v1
  bot_required: true
  configuration:
  - key: API_FOOTBALL_KEY
    type: string
    required: false
    required_environments:
    - live
    secret: true
    secret_type: api_key
    description: API key issued by dashboard.api-football.com.
  bindings:
  - id: score-posts
    kind: post_audience
    required: true
    manifest_destination: league-score-posts
    allowed_scopes:
    - custom
    default_scope: custom
    topic_configuration:
      premier_league:
        SPORTS_API_URL: https://v3.football.api-sports.io/fixtures?live=39
      spanish_league:
        SPORTS_API_URL: https://v3.football.api-sports.io/fixtures?live=140
      la_liga:
        SPORTS_API_URL: https://v3.football.api-sports.io/fixtures?live=140
  - id: score-alerts
    kind: messaging_audience
    required: true
    manifest_destination: league-score-alerts
    allowed_sources:
    - bot_topic_subscribers
    allowed_message_classes:
    - marketing
    supported_topics:
    - premier_league
    - spanish_league
    - la_liga
    paired_with: score-posts
  compatibility:
    environments:
    - test
    - live
    runtime: python3.12
  moderation:
    content_kind: sports-scores
    sources_required: true
  manifest: manifest.yaml
