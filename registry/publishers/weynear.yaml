api_version: registry.automations.weynear.com/v1
kind: Publisher
metadata:
  publisher: weynear
  display_name: Weynear
spec:
  github:
    owner: ericel
    repositories:
      - https://github.com/ericel/wahalao-automation
      - https://github.com/ericel/wahalao-template-maker
  artifact_registry:
    repository_prefix: us-central1-docker.pkg.dev/wahalao/wahalao-automations/weynear/
  builders:
    - https://github.com/ericel/wahalao-automation/.github/workflows/release-sports-template.yml@refs/heads/main
    - https://github.com/ericel/weynear-templates/.github/workflows/build-template.yml@refs/heads/main
  signing:
    algorithm: ec-sign-p256-sha256
    kms_key_resource: projects/wahalao/locations/global/keyRings/automation-registry/cryptoKeys/catalog-signing/cryptoKeyVersions/1
  required_attestations:
    - slsa-provenance-v1
    - spdx-2.3
